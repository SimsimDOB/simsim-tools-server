[project]
name = "simsim-tools-server"
version = "0.2.0"
description = ""
authors = [
    {name = "FernandoYu",email = "fyu@fi.uba.ar"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.123.9,<0.124.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pymupdf (>=1.26.6,<2.0.0)",
    "pillow-heif (>=1.1.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "simsim_tools_server", from = "src"}]

[tool.poetry.scripts]
main = "simsim_tools_server.main:main"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
httpx = "^0.28.1"
ruff = "^0.15.11"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
